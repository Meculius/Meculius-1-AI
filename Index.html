<!DOCTYPE html>
<html>
<head>
    <title>Meculius - Tech AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        h1 { color: #58a6ff; }
        #chatbox { width: 100%; max-width: 600px; height: 65vh; border: 1px solid #30363d; border-radius: 10px; padding: 15px; overflow-y: auto; background-color: #161b22; margin-bottom: 20px; }
        .message { margin: 10px 0; padding: 12px; border-radius: 8px; line-height: 1.5; font-size: 15px; }
        .user-msg { background-color: #1f6feb; color: white; text-align: right; margin-left: 20%; }
        .bot-msg { background-color: #21262d; text-align: left; border-left: 4px solid #3fb950; margin-right: 20%; }
        #input-area { width: 100%; max-width: 600px; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border: 1px solid #30363d; border-radius: 8px; background-color: #0d1117; color: white; font-size: 16px; }
        button { padding: 15px 20px; border: none; border-radius: 8px; background-color: #238636; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🤖 Meculius</h1>
    <div id="chatbox"></div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Ask anything about tech...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatbox = document.getElementById('chatbox');
            const text = input.value;
            if (!text) return;

            chatbox.innerHTML += `<div class="message user-msg">${text}</div>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            chatbox.innerHTML += `<div class="message bot-msg" id="loading">Meculius is thinking...</div>`;
            chatbox.scrollTop = chatbox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                document.getElementById('loading').remove();
                chatbox.innerHTML += `<div class="message bot-msg">${data.reply}</div>`;
            } catch (err) {
                document.getElementById('loading').remove();
                chatbox.innerHTML += `<div class="message bot-msg">Error: Connection failed.</div>`;
            }
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
  </html>
